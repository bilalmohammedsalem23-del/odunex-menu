<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Restaurant Catalog</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Caveat:wght@700&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Light Mode (Default) */
            --bg-color: #F5F2EF;
            --text-color: #5A3E36;
            --accent-color: #7A5648;
            --card-bg: #FFFFFF;
            --sidebar-bg: #FFFFFF;
            --shadow: 0 4px 20px rgba(90, 62, 54, 0.1);
            --border-color: #E8E0D5;
            --hover-bg: #FAF8F5;
        }

        .dark-mode {
            /* Dark Mode */
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --accent-color: #d4af37;
            --card-bg: #2d2d2d;
            --sidebar-bg: #222222;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --border-color: #444444;
            --hover-bg: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: 'Playfair Display', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        body[dir="rtl"] {            font-family: 'Tajawal', sans-serif;
        }

        /* Layout */
        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 120px;
            background: var(--sidebar-bg);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            overflow-y: auto;
            padding: 20px 10px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar.collapsed {
            transform: translateX(-100%);
        }

        .sidebar-toggle {
            position: absolute;
            top: 15px;
            right: -15px;
            background: var(--accent-color);
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            z-index: 101;
        }

        body[dir="rtl"] .sidebar-toggle {
            right: auto;
            left: -15px;
        }

        .category-icon {
            width: 80px;            height: 80px;
            border-radius: 50%;
            margin-bottom: 15px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .category-icon:hover,
        .category-icon.active {
            border-color: var(--accent-color);
            transform: scale(1.05);
        }

        /* Main Content */
        .main-content {
            margin-left: 120px;
            flex: 1;
            padding: 30px;
            transition: margin-left 0.3s;
        }

        .main-content.expanded {
            margin-left: 0;
        }

        /* Controls Bar */
        .controls-bar {
            position: fixed;
            top: 20px;
            left: 140px;
            display: flex;
            gap: 10px;
            z-index: 150;
        }

        body[dir="rtl"] .controls-bar {
            left: auto;
            right: 140px;
        }

        .control-btn {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;            font-weight: 700;
            font-size: 13px;
            color: var(--text-color);
            box-shadow: var(--shadow);
        }

        .control-btn:hover {
            background: var(--hover-bg);
        }

        /* Order Summary */
        .order-summary {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 320px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            z-index: 90;
            border: 2px solid var(--border-color);
            max-height: 80vh;
            overflow-y: auto;
        }

        body[dir="rtl"] .order-summary {
            right: auto;
            left: 20px;
        }

        .order-summary h3 {
            font-family: 'Caveat', cursive;
            font-size: 32px;
            color: var(--accent-color);
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 3px solid var(--border-color);
            padding-bottom: 10px;
        }

        body[dir="rtl"] .order-summary h3 {
            font-family: 'Tajawal', sans-serif;
            font-weight: 900;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;            padding: 12px;
            margin-bottom: 10px;
            background: var(--hover-bg);
            border-radius: 10px;
            font-family: 'Tajawal', sans-serif;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .cart-item-price {
            font-size: 12px;
            color: var(--accent-color);
        }

        .cart-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: var(--accent-color);
            color: white;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover {
            opacity: 0.8;
        }

        .remove-btn {
            background: #e74c3c;
            margin-left: 5px;
        }
        .order-total {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 3px dashed var(--border-color);
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-color);
        }

        .checkout-btn {
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .checkout-btn:hover {
            opacity: 0.9;
        }

        /* Menu Header */
        .menu-header {
            text-align: center;
            margin-bottom: 50px;
            margin-top: 40px;
        }

        .menu-header h1 {
            font-family: 'Caveat', cursive;
            font-size: 120px;
            color: var(--accent-color);
            line-height: 1;
            margin-bottom: 10px;
        }

        body[dir="rtl"] .menu-header h1 {
            font-family: 'Tajawal', sans-serif;
            font-weight: 900;
            font-size: 80px;
        }
        .menu-header span {
            font-size: 36px;
            letter-spacing: 15px;
            text-transform: uppercase;
            color: var(--text-color);
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 40px 0;
        }

        .page-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
        }

        .page-btn:hover,
        .page-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        /* Category Sections */
        .category-section {
            margin-bottom: 60px;
            scroll-margin-top: 100px;
        }

        .category-header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
        }

        body[dir="rtl"] .category-header {            flex-direction: row-reverse;
        }

        .category-header-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid var(--card-bg);
            box-shadow: var(--shadow);
            margin-right: 20px;
        }

        body[dir="rtl"] .category-header-img {
            margin-right: 0;
            margin-left: 20px;
        }

        .category-title {
            font-family: 'Caveat', cursive;
            font-size: 48px;
            color: white;
            background: var(--accent-color);
            padding: 10px 30px;
            border-radius: 50px;
            transform: rotate(-2deg);
        }

        body[dir="rtl"] .category-title {
            font-family: 'Tajawal', sans-serif;
            font-weight: 900;
            transform: rotate(2deg);
        }

        /* Food Grid */
        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .food-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.3s;
        }

        .food-card:hover {            transform: translateY(-5px);
        }

        .food-card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .food-card-body {
            padding: 20px;
        }

        .food-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .food-card-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .food-card-desc {
            font-size: 14px;
            color: #888;
            font-family: 'Tajawal', sans-serif;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .food-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .food-price {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-color);
        }

        .add-to-cart-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;            border: none;
            background: var(--accent-color);
            color: white;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .add-to-cart-btn:hover {
            transform: scale(1.1);
        }

        .add-to-cart-btn:active {
            transform: scale(0.95);
        }

        /* Search Bar */
        .search-container {
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 15px 25px;
            border: 2px solid var(--border-color);
            border-radius: 30px;
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            background: var(--card-bg);
            color: var(--text-color);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .order-summary {
                position: relative;
                top: 0;
                right: 0;
                width: 100%;
                margin-bottom: 30px;
            }
            .controls-bar {
                left: 130px;
            }

            body[dir="rtl"] .controls-bar {
                right: 130px;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 90px;
            }

            .category-icon {
                width: 60px;
                height: 60px;
            }

            .main-content {
                margin-left: 90px;
                padding: 20px;
            }

            .menu-header h1 {
                font-size: 70px;
            }

            .food-grid {
                grid-template-columns: 1fr;
            }

            .category-title {
                font-size: 32px;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .food-card {
            animation: fadeIn 0.5s ease;
        }

        /* Admin Panel Button */
        .admin-btn {
            position: fixed;            bottom: 30px;
            left: 30px;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            box-shadow: var(--shadow);
            z-index: 200;
        }

        body[dir="rtl"] .admin-btn {
            left: auto;
            right: 30px;
        }
    </style>
</head>

            // Sushi (Page 19)
            { id: 22, name: "Sushi Platter", nameAr: "طبق سوشي", nameKu: "تەختی سوشی", desc: "Assorted fresh sushi and sashimi", descAr: "تشكيلة سوشي وساشيمي", descKu: "سوشی جۆراوجۆر", price: 26.00, category: "sushi", image: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=400" },
            
            // Breakfast (Page 20)
            { id: 23, name: "Full Breakfast", nameAr: "إفطار كامل", nameKu: "بەیانیانی تەواو", desc: "Eggs, bacon, sausage, beans, toast", descAr: "بيض، بيكون، سجق، فاصوليا، توست", descKu: "هەلک، بەیکۆن", price: 15.00, category: "breakfast", image: "https://images.unsplash.com/photo-1533089862017-5614ecb352ae?w=400" }
        ];

        let currentLang = 'en';
        let cart = [];
        let currentPage = 1;
        const itemsPerPage = 6;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderMenu();
            renderPagination();
            loadTheme();
        });

        // Render Menu
        function renderMenu() {
            const container = document.getElementById('menuContainer');            container.innerHTML = '';
            
            const categories = [...new Set(menuData.map(item => item.category))];
            const t = translations[currentLang];
            
            categories.forEach((category, index) => {
                const categoryItems = menuData.filter(item => item.category === category);
                const section = document.createElement('div');
                section.className = 'category-section';
                section.id = `section-${category}`;
                
                // Category Header
                const header = document.createElement('div');
                header.className = 'category-header';
                const headerImg = categoryItems[0].image;
                header.innerHTML = `
                    <img src="${headerImg}" class="category-header-img" alt="${category}">
                    <div class="category-title">${t.categories[category]}</div>
                `;
                section.appendChild(header);
                
                // Food Grid
                const grid = document.createElement('div');
                grid.className = 'food-grid';
                
                categoryItems.forEach(item => {
                    const card = createFoodCard(item);
                    grid.appendChild(card);
                });
                
                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        function createFoodCard(item) {
            const name = currentLang === 'ar' ? item.nameAr : currentLang === 'ku' ? item.nameKu : item.name;
            const desc = currentLang === 'ar' ? item.descAr : currentLang === 'ku' ? item.descKu : item.desc;
            
            const card = document.createElement('div');
            card.className = 'food-card';
            card.innerHTML = `
                <img src="${item.image}" class="food-card-image" alt="${name}">
                <div class="food-card-body">
                    <div class="food-card-header">
                        <div>
                            <h3 class="food-card-title">${name}</h3>
                            <p class="food-card-desc">${desc}</p>
                        </div>
                    </div>                    <div class="food-card-footer">
                        <span class="food-price">$${item.price.toFixed(2)}</span>
                        <button class="add-to-cart-btn" onclick="addToCart(${item.id})">+</button>
                    </div>
                </div>
            `;
            return card;
        }

        // Pagination
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(menuData.length / itemsPerPage);
            
            pagination.innerHTML = '';
            
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.textContent = i;
                btn.onclick = () => goToPage(i);
                pagination.appendChild(btn);
            }
        }

        function goToPage(page) {
            currentPage = page;
            renderPagination();
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Cart Functions
        function addToCart(itemId) {
            const item = menuData.find(i => i.id === itemId);
            const existingItem = cart.find(i => i.id === itemId);
            
            if (existingItem) {
                existingItem.qty++;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            
            updateCart();
            document.getElementById('orderSummary').style.display = 'block';
        }

        function removeFromCart(itemId) {
            cart = cart.filter(item => item.id !== itemId);
            updateCart();            
            if (cart.length === 0) {
                document.getElementById('orderSummary').style.display = 'none';
            }
        }

        function updateQuantity(itemId, change) {
            const item = cart.find(i => i.id === itemId);
            if (item) {
                item.qty += change;
                if (item.qty <= 0) {
                    removeFromCart(itemId);
                } else {
                    updateCart();
                }
            }
        }

        function updateCart() {
            const container = document.getElementById('cartItems');
            const totalEl = document.getElementById('totalPrice');
            container.innerHTML = '';
            
            let total = 0;
            
            cart.forEach(item => {
                const name = currentLang === 'ar' ? item.nameAr : currentLang === 'ku' ? item.nameKu : item.name;
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <div class="cart-item-info">
                        <div class="cart-item-name">${name}</div>
                        <div class="cart-item-price">$${item.price.toFixed(2)} x ${item.qty}</div>
                    </div>
                    <div class="cart-controls">
                        <button class="qty-btn" onclick="updateQuantity(${item.id}, -1)">-</button>
                        <span>${item.qty}</span>
                        <button class="qty-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                        <button class="qty-btn remove-btn" onclick="removeFromCart(${item.id})">🗑</button>
                    </div>
                `;
                container.appendChild(div);
            });
            
            totalEl.textContent = `$${total.toFixed(2)}`;
        }
        function checkout() {
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            alert(`${translations[currentLang].checkout}\nTotal: $${total.toFixed(2)}\n\nThank you for your order!`);
            cart = [];
            updateCart();
            document.getElementById('orderSummary').style.display = 'none';
        }

        // UI Functions
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            const btn = document.querySelector('.sidebar-toggle');
            
            sidebar.classList.toggle('collapsed');
            mainContent.classList.toggle('expanded');
            
            btn.textContent = sidebar.classList.contains('collapsed') ? '▶' : '◀';
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
            }
        }

        function changeLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.body.dir = (lang === 'ar' || lang === 'ku') ? 'rtl' : 'ltr';
            
            // Update static texts
            const t = translations[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    el.textContent = t[key];
                }
            });
            
            // Update search placeholder
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
                        // Re-render menu
            renderMenu();
            updateCart();
        }

        function scrollToCategory(category) {
            const element = document.getElementById(`section-${category}`);
            if (element) {
                element.scrollIntoView({ behavior: 'smooth' });
            }
            
            // Update active icon
            document.querySelectorAll('.category-icon').forEach(icon => {
                icon.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        function searchFood() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.food-card');
            
            cards.forEach(card => {
                const title = card.querySelector('.food-card-title').textContent.toLowerCase();
                const desc = card.querySelector('.food-card-desc').textContent.toLowerCase();
                
                if (title.includes(searchTerm) || desc.includes(searchTerm)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function openAdminPanel() {
            const password = prompt('Enter admin password:');
            if (password === 'admin') {
                alert('Admin panel would open here. This is where you can add/edit/delete menu items.');
                // In a real app, this would open a full admin dashboard
            } else if (password !== null) {
                alert('Wrong password!');
            }
        }
    </script>

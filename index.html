<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>3D Menu</title>
<style>
  body { margin: 0; overflow: hidden; font-family: Arial; }
  #info {
    position: absolute;
    bottom: 20px;
    left: 20px;
    color: white;
    background: rgba(0,0,0,0.7);
    padding: 15px;
    border-radius: 10px;
    display: none;
  }
</style>
</head>
<body>

<div id="info"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<script>
// scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

// camera
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 3, 6);

// renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// controls
const controls = new THREE.OrbitControls(camera, renderer.domElement);

// light
const light = new THREE.PointLight(0xffffff, 1);
light.position.set(5, 5, 5);
scene.add(light);

// floor
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(20,20),
  new THREE.MeshStandardMaterial({ color: 0x222222 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// food items
const items = [];

function createFood(x, z, color, name, price) {
  const geo = new THREE.CylinderGeometry(1,1,0.5,32);
  const mat = new THREE.MeshStandardMaterial({ color });
  const mesh = new THREE.Mesh(geo, mat);

  mesh.position.set(x, 0.5, z);
  mesh.userData = { name, price };

  scene.add(mesh);
  items.push(mesh);
}

// create dishes
createFood(-3, 0, 0xff5733, "🍔 برغر", "8$");
createFood(0, 0, 0xffcc00, "🍕 بيتزا", "10$");
createFood(3, 0, 0x33ccff, "🥤 مشروب", "3$");

// raycaster (click detection)
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener("click", (event) => {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(items);

  if (intersects.length > 0) {
    const obj = intersects[0].object;
    const data = obj.userData;

    const info = document.getElementById("info");
    info.style.display = "block";
    info.innerHTML = `<h2>${data.name}</h2><p>السعر: ${data.price}</p>`;
  }
});

// animation
function animate() {
  requestAnimationFrame(animate);

  items.forEach(item => {
    item.rotation.y += 0.01;
  });

  controls.update();
  renderer.render(scene, camera);
}

animate();

// resize
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>

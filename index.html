<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>3D Restaurant Pro</title>
<style>
  body { margin:0; overflow:hidden; font-family:Arial; }
  #ui {
    position:absolute;
    bottom:20px;
    left:20px;
    background:rgba(0,0,0,0.8);
    color:white;
    padding:15px;
    border-radius:12px;
    display:none;
  }
</style>
</head>
<body>

<div id="ui"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<script>
// scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);

// camera
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 4, 8);

// renderer
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// controls
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// lights (cinematic)
const ambient = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambient);

const spot = new THREE.SpotLight(0xffaa88, 2);
spot.position.set(5,10,5);
spot.castShadow = true;
scene.add(spot);

// floor
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(30,30),
  new THREE.MeshStandardMaterial({ color:0x222222, roughness:0.8 })
);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

// table
const table = new THREE.Mesh(
  new THREE.CylinderGeometry(3,3,0.5,32),
  new THREE.MeshStandardMaterial({ color:0x444444 })
);
table.position.y = 0.25;
table.receiveShadow = true;
scene.add(table);

// dishes
const items = [];

function createDish(x,z,color,name,price){
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(0.8,0.8,0.4,32),
    new THREE.MeshStandardMaterial({ color, emissive:0x000000 })
  );

  mesh.position.set(x,0.7,z);
  mesh.castShadow = true;
  mesh.userData = {name, price};

  scene.add(mesh);
  items.push(mesh);
}

createDish(-2,0,0xff5533,"🍔 برغر فاخر","12$");
createDish(0,0,0xffcc00,"🍕 بيتزا إيطالية","15$");
createDish(2,0,0x33ccff,"🥤 مشروب بارد","5$");

// raycaster
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hovered = null;

window.addEventListener("mousemove", e=>{
  mouse.x = (e.clientX / innerWidth)*2 -1;
  mouse.y = -(e.clientY / innerHeight)*2 +1;
});

window.addEventListener("click", ()=>{
  if(hovered){
    const ui = document.getElementById("ui");
    ui.style.display = "block";
    ui.innerHTML = `<h2>${hovered.userData.name}</h2>
                    <p>السعر: ${hovered.userData.price}</p>`;
  }
});

// animate
function animate(){
  requestAnimationFrame(animate);

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(items);

  items.forEach(i => i.material.emissive.set(0x000000));

  if(hits.length){
    hovered = hits[0].object;
    hovered.material.emissive.set(0x333333);
    hovered.scale.set(1.2,1.2,1.2);
  } else {
    hovered = null;
    items.forEach(i => i.scale.set(1,1,1));
  }

  items.forEach(i => i.rotation.y += 0.01);

  controls.update();
  renderer.render(scene,camera);
}

animate();

// resize
addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Menu - 3 Languages</title>
    
    <!-- Fonts: Playfair Display (Serif), Caveat (Handwritten), Tajawal (Arabic/Kurdish) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Caveat:wght@700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Day Theme (Like Image) */
            --bg-color: #fdfbf7;
            --text-color: #4a3b32;
            --accent-color: #6d5246; /* Brownish */
            --card-bg: #ffffff;
            --shadow: 0 4px 15px rgba(0,0,0,0.08);
            --border-color: #e8e0d5;
            --sidebar-bg: #ffffff;
            --hover-bg: #f5f0eb;
        }

        .dark-mode {
            /* Night Theme */
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --accent-color: #d4af37; /* Gold */
            --card-bg: #2d2d2d;
            --shadow: 0 4px 15px rgba(0,0,0,0.4);
            --border-color: #444;
            --sidebar-bg: #222;
            --hover-bg: #333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }
        
        body {
            font-family: 'Playfair Display', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* RTL Support for Arabic/Kurdish */
        body[dir="rtl"] {
            font-family: 'Tajawal', sans-serif;
        }        body[dir="rtl"] .handwritten {
            font-family: 'Tajawal', sans-serif;
            font-weight: 900;
            letter-spacing: 0;
        }

        /* Sidebar */
        .sidebar {
            width: 110px;
            background: var(--sidebar-bg);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            z-index: 100;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }
        
        .sidebar.collapsed { transform: translateX(-100%); }
        
        .nav-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 15px;
            object-fit: cover;
            cursor: pointer;
            border: 3px solid transparent;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .nav-icon:hover, .nav-icon.active {
            border-color: var(--accent-color);
            transform: scale(1.05);
        }

        /* Main Content */
        .main-content {
            margin-left: 110px;
            flex: 1;
            padding: 40px;
            transition: margin-left 0.3s ease;
            position: relative;
        }        .main-content.expanded { margin-left: 0; }

        /* Controls (Lang & Theme) */
        .controls {
            position: fixed;
            top: 20px;
            left: 120px; /* Adjust based on sidebar */
            display: flex;
            gap: 10px;
            z-index: 150;
        }
        body[dir="rtl"] .controls { left: auto; right: 120px; }
        
        .control-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-weight: bold;
            font-size: 12px;
            color: var(--text-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .control-btn:hover { background: var(--hover-bg); }

        /* Order Summary (Top Right) */
        .order-summary {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 280px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            z-index: 90;
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }
        body[dir="rtl"] .order-summary { right: auto; left: 20px; }
        
        .order-summary h3 {
            font-family: 'Caveat', cursive; /* Handwritten style for title */
            font-size: 28px;
            color: var(--accent-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 10px;            text-align: center;
        }
        body[dir="rtl"] .order-summary h3 { font-family: 'Tajawal', sans-serif; font-weight: 900; }

        .order-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            font-family: 'Tajawal', sans-serif;
        }
        .order-total {
            font-weight: bold;
            font-size: 20px;
            margin-top: 15px;
            border-top: 2px dashed var(--border-color);
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            color: var(--accent-color);
        }

        /* Menu Typography & Layout */
        .menu-title {
            text-align: center;
            margin-bottom: 50px;
            margin-top: 20px;
        }
        .menu-title h1 {
            font-size: 100px;
            color: var(--accent-color);
            font-family: 'Caveat', cursive; /* Big Handwritten */
            line-height: 1;
        }
        .menu-title span {
            font-size: 40px;
            letter-spacing: 10px;
            text-transform: uppercase;
            font-family: 'Playfair Display', serif;
            color: var(--text-color);
        }

        .category-section { margin-bottom: 60px; position: relative; }
        
        .category-header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }
        body[dir="rtl"] .category-header { flex-direction: row-reverse; }        
        .category-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid var(--card-bg);
            box-shadow: var(--shadow);
            margin-right: 20px;
        }
        body[dir="rtl"] .category-img { margin-right: 0; margin-left: 20px; }

        .category-title {
            font-family: 'Caveat', cursive;
            font-size: 48px;
            color: #fff;
            background: var(--accent-color);
            padding: 5px 25px;
            border-radius: 50px;
            transform: rotate(-2deg);
        }
        body[dir="rtl"] .category-title { font-family: 'Tajawal', sans-serif; font-weight: 900; transform: rotate(2deg); }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px dotted var(--border-color);
        }
        
        .item-info { flex: 1; margin-left: 15px; }
        body[dir="rtl"] .item-info { margin-left: 0; margin-right: 15px; }
        
        .item-info h4 { font-size: 18px; margin-bottom: 5px; font-weight: 700; }
        .item-info p { font-size: 14px; color: #888; font-family: 'Tajawal', sans-serif; }
        
        .item-price { font-weight: bold; font-size: 20px; color: var(--accent-color); margin-left: 15px; }
        body[dir="rtl"] .item-price { margin-left: 0; margin-right: 15px; }
        
        .add-btn {
            background: var(--accent-color);
            color: #fff;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .add-btn:active { transform: scale(0.9); }

        /* Sidebar Toggle Button */
        .sidebar-toggle {
            position: absolute;
            top: 15px;
            right: -15px;
            background: var(--accent-color);
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 101;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        body[dir="rtl"] .sidebar-toggle { right: auto; left: -15px; }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { width: 80px; }
            .nav-icon { width: 50px; height: 50px; }
            .main-content { margin-left: 80px; padding: 20px; }
            .order-summary { position: relative; top: 0; right: 0; width: 100%; margin-bottom: 20px; }
            .menu-title h1 { font-size: 60px; }
            .category-title { font-size: 32px; }
            .category-img { width: 100px; height: 100px; }
            .controls { top: 10px; left: 90px; }
            body[dir="rtl"] .controls { right: 90px; }
        }
    </style>
</head>
<body>

    <!-- Controls -->
    <div class="controls">
        <button class="control-btn" onclick="toggleTheme()">🌓</button>
        <select class="control-btn" id="langSelect" onchange="changeLanguage(this.value)">
            <option value="en">English</option>
            <option value="ar">العربية</option>
            <option value="ku">کوردی</option>
        </select>
    </div>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <button class="sidebar-toggle" onclick="toggleSidebar()">◀</button>
        <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=200" class="nav-icon active" onclick="scrollTo('main')" alt="Burger">
        <img src="https://images.unsplash.com/photo-1626202158825-3c5b13ad6155?w=200" class="nav-icon" onclick="scrollTo('appetizer')" alt="Appetizer">
        <img src="https://images.unsplash.com/photo-1550304943-4f24f54ddde9?w=200" class="nav-icon" onclick="scrollTo('salad')" alt="Salad">
        <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=200" class="nav-icon" onclick="scrollTo('dessert')" alt="Dessert">
        <img src="https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=200" class="nav-icon" onclick="scrollTo('drinks')" alt="Drinks">
    </div>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        
        <!-- Order Summary -->
        <div class="order-summary" id="orderSummary" style="display:none;">
            <h3 data-i18n="orderSummary">Order Summary</h3>
            <div id="orderItems"></div>
            <div class="order-total">
                <span data-i18n="total">Total:</span>
                <span id="totalPrice">$0.00</span>
            </div>
        </div>

        <div class="menu-title">
            <h1>FOOD</h1>
            <span data-i18n="menu">MENU</span>
        </div>

        <div id="menuContainer">
            <!-- Sections will be injected here via JS -->
        </div>
    </div>

    <script>
        // --- DATA & TRANSLATIONS ---
        const translations = {
            en: {
                menu: "MENU",
                orderSummary: "Order Summary",
                total: "Total:",
                checkout: "Checkout",
                categories: { main: "Main Course", appetizer: "Appetizer", salad: "Salad", dessert: "Dessert", drinks: "Drinks" },
                items: {
                    "burger": { name: "Gourmet Black Burger", desc: "Angus beef, cheddar, lettuce on a black bun." },
                    "spring": { name: "Gourmet Spring Rolls", desc: "Hand-rolled with fresh vegetables and sweet chili sauce." },
                    "salad": { name: "Fresh Garden Salad", desc: "Romaine lettuce, avocado, and balsamic dressing." },
                    "dessert": { name: "Chocolate Lava Cake", desc: "Warm molten center served with vanilla ice cream." }
                }
            },            ar: {
                menu: "قائمة الطعام",
                orderSummary: "ملخص الطلب",
                total: "المجموع:",
                checkout: "إتمام الطلب",
                categories: { main: "الأطباق الرئيسية", appetizer: "المقبلات", salad: "السلطات", dessert: "الحلويات", drinks: "المشروبات" },
                items: {
                    "burger": { name: "برجر أسود فاخر", desc: "لحم أنغوس، شيدر، خس على خبز أسود." },
                    "spring": { name: "سبرينغ رولز فاخرة", desc: "محشوة بالخضار الطازجة مع صوص الفلفل الحلو." },
                    "salad": { name: "سلطة حديقة طازجة", desc: "خس رومين، أفوكادو، وصوص البلسميك." },
                    "dessert": { name: "كيكة شوكولاتة لاڤا", desc: "قلب دافئ سائل تقدم مع آيس كريم الفانيليا." }
                }
            },
            ku: {
                menu: "پێرستی خواردن",
                orderSummary: "کورتەی داواکاری",
                total: "کۆ:",
                checkout: "تەواوکردن",
                categories: { main: "خواردنی سەرەکی", appetizer: "پێشگر", salad: "سەڵاتە", dessert: "شیرینی", drinks: "خواردنەوەکان" },
                items: {
                    "burger": { name: "هەمبەرگری ڕەشی تایبەت", desc: "گۆشتی ئەنگەس، چێدەر، لەتۆس لەسەر نانی ڕەش." },
                    "spring": { name: "سپرینگ ڕۆڵز تایبەت", desc: "دەستی لەگەڵ سەوزە تازەکان و سۆسی فلفل." },
                    "salad": { name: "سەڵاتەی باخچە تازە", desc: "لەتۆس، ئەڤۆکادۆ، و سۆسی بەلسامیک." },
                    "dessert": { name: "کێکی شۆکلاتەی لاڤا", desc: "ناوەندی گەرم و شل لەگەڵ ئایسکرێمی ڤانیلا." }
                }
            }
        };

        const menuData = [
            { id: 1, key: "burger", cat: "main", price: 18.50, img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400" },
            { id: 2, key: "spring", cat: "appetizer", price: 12.25, img: "https://images.unsplash.com/photo-1626202158825-3c5b13ad6155?w=400" },
            { id: 3, key: "salad", cat: "salad", price: 14.00, img: "https://images.unsplash.com/photo-1550304943-4f24f54ddde9?w=400" },
            { id: 4, key: "dessert", cat: "dessert", price: 10.25, img: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400" },
            // Adding more items to simulate 20 pages feel
            { id: 5, key: "burger", cat: "main", price: 16.00, img: "https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?w=400" },
            { id: 6, key: "spring", cat: "appetizer", price: 11.50, img: "https://images.unsplash.com/photo-1608039755401-742074f0548d?w=400" },
        ];

        let currentLang = 'en';
        let cart = [];

        // --- FUNCTIONS ---
        function init() {
            renderMenu();
            changeLanguage('en');
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';            const cats = ['main', 'appetizer', 'salad', 'dessert', 'drinks'];
            
            // Images for headers
            const headerImgs = {
                main: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400",
                appetizer: "https://images.unsplash.com/photo-1626202158825-3c5b13ad6155?w=400",
                salad: "https://images.unsplash.com/photo-1550304943-4f24f54ddde9?w=400",
                dessert: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400",
                drinks: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=400"
            };

            cats.forEach(cat => {
                const items = menuData.filter(i => i.cat === cat);
                if(items.length === 0) return;

                const section = document.createElement('div');
                section.className = 'category-section';
                section.id = `section-${cat}`;

                section.innerHTML = `
                    <div class="category-header">
                        <img src="${headerImgs[cat]}" class="category-img">
                        <div class="category-title" data-i18n-cat="${cat}">${translations[currentLang].categories[cat]}</div>
                    </div>
                `;

                items.forEach(item => {
                    const itemData = translations[currentLang].items[item.key];
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'menu-item';
                    itemDiv.innerHTML = `
                        <div style="display:flex; align-items:center;">
                            <img src="${item.img}" style="width:60px; height:60px; border-radius:50%; object-fit:cover; margin-right:15px;">
                            <div class="item-info">
                                <h4>${itemData.name}</h4>
                                <p>${itemData.desc}</p>
                            </div>
                        </div>
                        <div style="display:flex; align-items:center;">
                            <span class="item-price">$${item.price.toFixed(2)}</span>
                            <button class="add-btn" onclick="addToCart(${item.id})">+</button>
                        </div>
                    `;
                    section.appendChild(itemDiv);
                });
                container.appendChild(section);
            });
        }

        function changeLanguage(lang) {            currentLang = lang;
            document.documentElement.lang = lang;
            document.body.dir = lang === 'ar' || lang === 'ku' ? 'rtl' : 'ltr';
            
            // Update static texts
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.innerText = translations[lang][el.getAttribute('data-i18n')];
            });
            
            // Update Category Titles
            document.querySelectorAll('[data-i18n-cat]').forEach(el => {
                const cat = el.getAttribute('data-i18n-cat');
                el.innerText = translations[lang].categories[cat];
            });

            // Re-render menu items for translation
            renderMenu();
            updateCart(); // Update cart item names
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
            document.getElementById('mainContent').classList.toggle('expanded');
            const btn = document.querySelector('.sidebar-toggle');
            btn.innerHTML = document.getElementById('sidebar').classList.contains('collapsed') ? '▶' : '◀';
        }

        function addToCart(id) {
            const item = menuData.find(i => i.id === id);
            const itemData = translations[currentLang].items[item.key];
            cart.push({ ...item, name: itemData.name, price: item.price });
            updateCart();
            
            // Show summary
            document.getElementById('orderSummary').style.display = 'block';
        }

        function updateCart() {
            const container = document.getElementById('orderItems');
            container.innerHTML = '';
            let total = 0;
            
            // Group by name for cleaner look
            const counts = {};
            cart.forEach(x => { counts[x.name] = (counts[x.name] || 0) + 1; });
                        // Calculate total based on original array to keep price accurate
            // Note: simplified for demo
            
            Object.keys(counts).forEach(name => {
                const count = counts[name];
                const originalItem = cart.find(c => c.name === name); // Find one to get price
                const price = originalItem.price;
                total += price * count;

                const div = document.createElement('div');
                div.className = 'order-item';
                div.innerHTML = `
                    <span>${count}x ${name}</span>
                    <span>$${(price * count).toFixed(2)}</span>
                `;
                container.appendChild(div);
            });

            document.getElementById('totalPrice').innerText = '$' + total.toFixed(2);
        }

        function scrollTo(id) {
            document.querySelectorAll('.nav-icon').forEach(i => i.classList.remove('active'));
            event.target.classList.add('active');
            const el = document.getElementById(`section-${id}`);
            if(el) el.scrollIntoView({behavior: 'smooth'});
        }

        init();
    </script>
</body>
</html>

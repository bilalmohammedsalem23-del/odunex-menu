<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Restaurant 3D Menu</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Caveat:wght@700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>

:root {
    --bg: #f5f2ef;
    --text: #5a3e36;
    --accent: #7a5648;
    --card: #ffffff;
    --border: #e8e0d5;
    --hover: #faf8f5;
    --shadow: 0 12px 35px rgba(90,62,54,.12);
    --radius: 22px;
}

.dark-mode {
    --bg: #171717;
    --text: #f5f5f5;
    --accent: #d4af37;
    --card: #252525;
    --border: #444;
    --hover: #303030;
    --shadow: 0 15px 40px rgba(0,0,0,.45);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    overflow-x: hidden;
    transition: .3s;
}

/* =========================
   APP
========================= */

.app-container {
    min-height: 100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    position: fixed;
    top: 0;
    right: 0;

    width: 110px;
    height: 100vh;

    padding: 25px 12px;

    background: var(--card);

    box-shadow: -5px 0 25px rgba(0,0,0,.08);

    z-index: 1000;

    overflow-y: auto;

    transition: transform .35s ease;
}

.sidebar.collapsed {
    transform: translateX(100%);
}

.sidebar-toggle {
    position: absolute;

    top: 15px;
    left: -15px;

    width: 32px;
    height: 32px;

    border: 0;
    border-radius: 50%;

    background: var(--accent);
    color: white;

    cursor: pointer;

    z-index: 1001;
}

.category-icon {
    display: block;

    width: 75px;
    height: 75px;

    margin: 0 auto 18px;

    border-radius: 50%;

    object-fit: cover;

    cursor: pointer;

    border: 4px solid transparent;

    box-shadow: 0 5px 15px rgba(0,0,0,.15);

    transition:
        transform .35s ease,
        border-color .3s ease,
        box-shadow .3s ease;
}

.category-icon:hover,
.category-icon.active {
    border-color: var(--accent);

    transform:
        scale(1.08)
        translateZ(10px);

    box-shadow:
        0 10px 25px rgba(0,0,0,.25);
}

/* =========================
   MAIN
========================= */

.main-content {
    margin-right: 110px;

    padding: 35px;

    transition: margin-right .35s ease;
}

.main-content.expanded {
    margin-right: 0;
}

/* =========================
   CONTROLS
========================= */

.controls-bar {
    position: fixed;

    top: 20px;
    right: 130px;

    display: flex;
    gap: 10px;

    z-index: 900;
}

.control-btn {
    border: 2px solid var(--border);

    background: var(--card);
    color: var(--text);

    padding: 10px 16px;

    border-radius: 30px;

    cursor: pointer;

    font-family: 'Tajawal';

    box-shadow: var(--shadow);

    transition: .3s;
}

.control-btn:hover {
    transform: translateY(-2px);
}

/* =========================
   HEADER
========================= */

.menu-header {
    text-align: center;

    margin:
        70px 0 50px;
}

.menu-header h1 {
    font-family: 'Caveat';

    font-size: clamp(70px, 10vw, 130px);

    color: var(--accent);

    line-height: .9;
}

.menu-header span {
    font-size: 30px;

    font-weight: 900;

    letter-spacing: 8px;
}

/* =========================
   SEARCH
========================= */

.search-container {
    max-width: 900px;

    margin:
        0 auto 40px;
}

.search-input {
    width: 100%;

    padding: 17px 25px;

    border-radius: 50px;

    border: 2px solid var(--border);

    background: var(--card);

    color: var(--text);

    font-family: 'Tajawal';

    font-size: 17px;

    outline: none;

    box-shadow: var(--shadow);

    transition: .3s;
}

.search-input:focus {
    border-color: var(--accent);

    transform: scale(1.01);
}

/* =========================
   CATEGORY
========================= */

.category-section {
    margin-bottom: 70px;

    scroll-margin-top: 100px;
}

.category-header {
    display: flex;

    align-items: center;

    gap: 20px;

    margin-bottom: 30px;
}

.category-header-img {
    width: 105px;
    height: 105px;

    object-fit: cover;

    border-radius: 50%;

    border: 5px solid var(--card);

    box-shadow: var(--shadow);

    transition: transform .4s;
}

.category-header-img:hover {
    transform:
        rotate(5deg)
        scale(1.05);
}

.category-title {
    display: inline-block;

    padding: 12px 30px;

    background: var(--accent);

    color: white;

    border-radius: 50px;

    font-size: 36px;

    font-weight: 900;

    transform: rotate(2deg);

    box-shadow: var(--shadow);
}

/* =========================
   FOOD GRID
========================= */

.food-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(280px, 1fr));

    gap: 30px;
}

/* =========================
   3D FOOD CARD
========================= */

.food-card {
    position: relative;

    background: var(--card);

    border-radius: var(--radius);

    overflow: hidden;

    box-shadow: var(--shadow);

    transform-style: preserve-3d;

    perspective: 1200px;

    transition:
        transform .15s ease,
        box-shadow .3s ease;

    will-change: transform;
}

.food-card:hover {
    box-shadow:
        0 25px 55px rgba(0,0,0,.22);
}

/* Image wrapper */

.food-image-wrapper {
    position: relative;

    height: 230px;

    overflow: hidden;

    transform-style: preserve-3d;
}

/* Food image */

.food-card-image {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

    transition:
        transform .5s ease,
        filter .4s ease;
}

.food-card:hover .food-card-image {
    transform:
        scale(1.12)
        translateZ(25px);

    filter:
        saturate(1.1)
        contrast(1.05);
}

/* 3D shine */

.food-image-wrapper::after {
    content: "";

    position: absolute;

    top: 0;
    left: -120%;

    width: 70%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            transparent
        );

    transform: skewX(-20deg);

    transition: left .7s ease;

    pointer-events: none;
}

.food-card:hover .food-image-wrapper::after {
    left: 140%;
}

/* Image badge */

.food-badge {
    position: absolute;

    top: 15px;
    right: 15px;

    padding: 7px 13px;

    border-radius: 20px;

    background: rgba(0,0,0,.65);

    color: white;

    font-size: 12px;

    backdrop-filter: blur(5px);

    z-index: 2;
}

/* =========================
   CARD BODY
========================= */

.food-card-body {
    padding: 22px;

    transform:
        translateZ(25px);
}

.food-card-title {
    font-size: 21px;

    font-weight: 900;

    margin-bottom: 8px;
}

.food-card-desc {
    color: #888;

    line-height: 1.7;

    font-size: 14px;

    min-height: 45px;

    margin-bottom: 18px;
}

.food-card-footer {
    display: flex;

    align-items: center;

    justify-content: space-between;
}

.food-price {
    font-size: 24px;

    color: var(--accent);

    font-weight: 900;
}

.add-to-cart-btn {
    width: 48px;
    height: 48px;

    border: 0;

    border-radius: 50%;

    background: var(--accent);

    color: white;

    font-size: 27px;

    cursor: pointer;

    box-shadow:
        0 8px 18px rgba(0,0,0,.2);

    transition:
        transform .25s,
        box-shadow .25s;
}

.add-to-cart-btn:hover {
    transform:
        scale(1.15)
        translateZ(15px);

    box-shadow:
        0 12px 25px rgba(0,0,0,.3);
}

/* =========================
   PAGINATION
========================= */

.pagination {
    display: flex;

    justify-content: center;

    align-items: center;

    gap: 10px;

    margin: 50px 0;
}

.page-btn {
    width: 45px;
    height: 45px;

    border-radius: 50%;

    border: 2px solid var(--border);

    background: var(--card);

    color: var(--text);

    cursor: pointer;

    font-weight: 900;

    transition: .25s;
}

.page-btn:hover,
.page-btn.active {
    background: var(--accent);

    color: white;

    border-color: var(--accent);

    transform: translateY(-3px);
}

/* =========================
   CART
========================= */

.order-summary {
    position: fixed;

    bottom: 20px;
    left: 20px;

    width: 330px;

    max-height: 75vh;

    overflow-y: auto;

    padding: 22px;

    background: var(--card);

    border: 2px solid var(--border);

    border-radius: 22px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.25);

    z-index: 1100;

    animation: cartIn .4s ease;
}

@keyframes cartIn {
    from {
        opacity: 0;
        transform: translateY(30px) scale(.9);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.order-summary h3 {
    text-align: center;

    font-size: 25px;

    color: var(--accent);

    margin-bottom: 18px;
}

.cart-item {
    display: flex;

    align-items: center;

    gap: 10px;

    padding: 12px;

    margin-bottom: 10px;

    border-radius: 12px;

    background: var(--hover);
}

.cart-item-info {
    flex: 1;
}

.cart-item-name {
    font-weight: 900;

    font-size: 14px;
}

.cart-item-price {
    color: var(--accent);

    font-size: 12px;

    margin-top: 4px;
}

.cart-controls {
    display: flex;

    align-items: center;

    gap: 5px;
}

.qty-btn {
    width: 28px;
    height: 28px;

    border: 0;

    border-radius: 50%;

    background: var(--accent);

    color: white;

    cursor: pointer;
}

.remove-btn {
    background: #d9534f;
}

.order-total {
    display: flex;

    justify-content: space-between;

    margin-top: 18px;

    padding-top: 15px;

    border-top: 2px dashed var(--border);

    font-size: 20px;

    font-weight: 900;

    color: var(--accent);
}

.checkout-btn {
    width: 100%;

    margin-top: 15px;

    padding: 14px;

    border: 0;

    border-radius: 12px;

    background: var(--accent);

    color: white;

    font-family: 'Tajawal';

    font-weight: 900;

    cursor: pointer;
}

/* =========================
   ADMIN
========================= */

.admin-btn {
    position: fixed;

    bottom: 25px;
    right: 25px;

    padding: 13px 20px;

    border: 0;

    border-radius: 30px;

    background: var(--accent);

    color: white;

    font-family: 'Tajawal';

    font-weight: 900;

    cursor: pointer;

    z-index: 1200;

    box-shadow: var(--shadow);
}

/* =========================
   EMPTY SEARCH
========================= */

.no-results {
    text-align: center;

    padding: 50px;

    font-size: 20px;

    color: #888;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width: 900px) {

    .sidebar {
        width: 85px;
    }

    .category-icon {
        width: 58px;
        height: 58px;
    }

    .main-content {
        margin-right: 85px;

        padding: 20px;
    }

    .controls-bar {
        right: 100px;
    }

    .order-summary {
        width: 300px;
    }
}

@media(max-width: 650px) {

    .sidebar {
        width: 75px;
    }

    .category-icon {
        width: 52px;
        height: 52px;
    }

    .main-content {
        margin-right: 75px;

        padding: 15px;
    }

    .controls-bar {
        position: static;

        justify-content: center;

        margin-bottom: 20px;
    }

    .menu-header {
        margin-top: 30px;
    }

    .menu-header h1 {
        font-size: 75px;
    }

    .menu-header span {
        font-size: 20px;
        letter-spacing: 4px;
    }

    .category-header {
        gap: 10px;
    }

    .category-header-img {
        width: 75px;
        height: 75px;
    }

    .category-title {
        font-size: 23px;

        padding: 10px 18px;
    }

    .food-grid {
        grid-template-columns: 1fr;
    }

    .order-summary {
        left: 10px;
        right: 10px;

        bottom: 10px;

        width: auto;

        max-height: 55vh;
    }

    .admin-btn {
        right: 15px;
        bottom: 15px;
    }
}

</style>
</head>

/* =========================================================
   STATE
========================================================= */

let currentLang = localStorage.getItem("language") || "ar";

let cart =
    JSON.parse(localStorage.getItem("cart") || "[]");

let currentPage = 1;

const itemsPerPage = 6;


/* =========================================================
   INITIALIZE
========================================================= */

document.addEventListener("DOMContentLoaded", () => {

    document.getElementById("langSelect").value =
        currentLang;

    loadTheme();

    updateLanguageUI();

    renderMenu();

    renderPagination();

    updateCart();

    setup3DEffect();

});


/* =========================================================
   RENDER MENU
========================================================= */

function renderMenu() {

    const container =
        document.getElementById("menuContainer");

    container.innerHTML = "";

    const search =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    let filtered = menuData.filter(item => {

        const values = [
            item.name,
            item.nameAr,
            item.nameKu,
            item.desc,
            item.descAr,
            item.descKu
        ];

        return values.some(value =>
            value.toLowerCase().includes(search)
        );

    });

    if (search) {

        renderSearchResults(filtered);

        return;
    }

    const start =
        (currentPage - 1) * itemsPerPage;

    const pageItems =
        filtered.slice(
            start,
            start + itemsPerPage
        );

    const categories =
        [...new Set(
            pageItems.map(item => item.category)
        )];

    categories.forEach(category => {

        const categoryItems =
            pageItems.filter(
                item => item.category === category
            );

        const section =
            document.createElement("section");

        section.className =
            "category-section";

        section.id =
            `section-${category}`;

        const header =
            document.createElement("div");

        header.className =
            "category-header";

        header.innerHTML = `

            <img
                src="${categoryItems[0].image}"
                class="category-header-img"
                loading="lazy">

            <div class="category-title">
                ${translations[currentLang]
                    .categories[category]}
            </div>

        `;

        section.appendChild(header);

        const grid =
            document.createElement("div");

        grid.className =
            "food-grid";

        categoryItems.forEach(item => {

            grid.appendChild(
                createFoodCard(item)
            );

        });

        section.appendChild(grid);

        container.appendChild(section);

    });

    setup3DEffect();

}


/* =========================================================
   SEARCH RESULTS
========================================================= */

function renderSearchResults(items) {

    const container =
        document.getElementById("menuContainer");

    if (!items.length) {

        container.innerHTML = `
            <div class="no-results">
                🔍 لا توجد نتائج
            </div>
        `;

        return;
    }

    const grid =
        document.createElement("div");

    grid.className =
        "food-grid";

    items.forEach(item => {

        grid.appendChild(
            createFoodCard(item)
        );

    });

    container.appendChild(grid);

    setup3DEffect();

}


/* =========================================================
   CREATE CARD
========================================================= */

function createFoodCard(item) {

    const name =
        currentLang === "ar"
            ? item.nameAr
            : currentLang === "ku"
                ? item.nameKu
                : item.name;

    const desc =
        currentLang === "ar"
            ? item.descAr
            : currentLang === "ku"
                ? item.descKu
                : item.desc;

    const card =
        document.createElement("article");

    card.className =
        "food-card";

    card.dataset.id =
        item.id;

    card.innerHTML = `

        <div class="food-image-wrapper">

            <span class="food-badge">
                ${translations[currentLang]
                    .categories[item.category]}
            </span>

            <img
                src="${item.image}"
                class="food-card-image"
                alt="${name}"
                loading="lazy"
                onerror="this.src='https://images.unsplash.com/photo-1547592180-85f173990554?w=700'">

        </div>

        <div class="food-card-body">

            <h3 class="food-card-title">
                ${name}
            </h3>

            <p class="food-card-desc">
                ${desc}
            </p>

            <div class="food-card-footer">

                <span class="food-price">
                    $${item.price.toFixed(2)}
                </span>

                <button
                    class="add-to-cart-btn"
                    onclick="addToCart(${item.id})">
                    +
                </button>

            </div>

        </div>
    `;

    return card;
}


/* =========================================================
   PAGINATION
========================================================= */

function renderPagination() {

    const pagination =
        document.getElementById("pagination");

    pagination.innerHTML = "";

    const totalPages =
        Math.ceil(
            menuData.length / itemsPerPage
        );

    for (
        let page = 1;
        page <= totalPages;
        page++
    ) {

        const button =
            document.createElement("button");

        button.className =
            `page-btn ${
                page === currentPage
                    ? "active"
                    : ""
            }`;

        button.textContent =
            page;

        button.onclick =
            () => goToPage(page);

        pagination.appendChild(button);

    }

}


function goToPage(page) {

    currentPage = page;

    renderMenu();

    renderPagination();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   CART
========================================================= */

function addToCart(id) {

    const item =
        menuData.find(
            item => item.id === id
        );

    if (!item) return;

    const existing =
        cart.find(
            item => item.id === id
        );

    if (existing) {

        existing.qty++;

    } else {

        cart.push({
            ...item,
            qty: 1
        });

    }

    saveCart();

    updateCart();

    document
        .getElementById("orderSummary")
        .style.display = "block";

}


function updateQuantity(id, change) {

    const item =
        cart.find(
            item => item.id === id
        );

    if (!item) return;

    item.qty += change;

    if (item.qty <= 0) {

        cart =
            cart.filter(
                item => item.id !== id
            );

    }

    saveCart();

    updateCart();

}


function removeFromCart(id) {

    cart =
        cart.filter(
            item => item.id !== id
        );

    saveCart();

    updateCart();

}


function updateCart() {

    const container =
        document.getElementById("cartItems");

    const summary =
        document.getElementById("orderSummary");

    container.innerHTML = "";

    let total = 0;

    cart.forEach(item => {

        const name =
            currentLang === "ar"
                ? item.nameAr
                : currentLang === "ku"
                    ? item.nameKu
                    : item.name;

        total +=
            item.price * item.qty;

        const div =
            document.createElement("div");

        div.className =
            "cart-item";

        div.innerHTML = `

            <div class="cart-item-info">

                <div class="cart-item-name">
                    ${name}
                </div>

                <div class="cart-item-price">
                    $${item.price.toFixed(2)}
                    × ${item.qty}
                </div>

            </div>

            <div class="cart-controls">

                <button
                    class="qty-btn"
                    onclick="updateQuantity(${item.id}, -1)">
                    −
                </button>

                <span>${item.qty}</span>

                <button
                    class="qty-btn"
                    onclick="updateQuantity(${item.id}, 1)">
                    +
                </button>

                <button
                    class="qty-btn remove-btn"
                    onclick="removeFromCart(${item.id})">
                    ×
                </button>

            </div>
        `;

        container.appendChild(div);

    });

    document.getElementById("totalPrice")
        .textContent =
        `$${total.toFixed(2)}`;

    summary.style.display =
        cart.length
            ? "block"
            : "none";

}


function saveCart() {

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

}


/* =========================================================
   CHECKOUT
========================================================= */

function checkout() {

    if (!cart.length) return;

    const total =
        cart.reduce(
            (sum, item) =>
                sum + item.price * item.qty,
            0
        );

    alert(
        `${translations[currentLang].checkout}\n\n` +
        `Total: $${total.toFixed(2)}\n\n` +
        `Thank you for your order!`
    );

    cart = [];

    saveCart();

    updateCart();

}


/* =========================================================
   SEARCH
========================================================= */

function searchFood() {

    currentPage = 1;

    renderMenu();

    renderPagination();

}


/* =========================================================
   LANGUAGE
========================================================= */

function changeLanguage(lang) {

    currentLang = lang;

    localStorage.setItem(
        "language",
        lang
    );

    updateLanguageUI();

    renderMenu();

    renderPagination();

    updateCart();

}


function updateLanguageUI() {

    const t =
        translations[currentLang];

    document.documentElement.lang =
        currentLang;

    document.body.dir =
        currentLang === "en"
            ? "ltr"
            : "rtl";

    document.getElementById("menuTitle")
        .textContent = t.menu;

    document.getElementById("orderTitle")
        .textContent = t.order;

    document.getElementById("totalLabel")
        .textContent = t.total;

    document.getElementById("checkoutBtn")
        .textContent = t.checkout;

    document.getElementById("themeText")
        .textContent = t.theme;

    document.getElementById("searchInput")
        .placeholder = t.search;

    document.querySelector(".admin-btn")
        .innerHTML =
        `🔐 ${t.admin}`;

}


/* =========================================================
   THEME
========================================================= */

function toggleTheme() {

    document.body
        .classList
        .toggle("dark-mode");

    localStorage.setItem(
        "theme",
        document.body.classList.contains(
            "dark-mode"
        )
            ? "dark"
            : "light"
    );

}


function loadTheme() {

    if (
        localStorage.getItem("theme")
        === "dark"
    ) {

        document.body
            .classList
            .add("dark-mode");

    }

}


/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar() {

    const sidebar =
        document.getElementById("sidebar");

    const main =
        document.getElementById("mainContent");

    const button =
        document.querySelector(
            ".sidebar-toggle"
        );

    sidebar.classList.toggle("collapsed");

    main.classList.toggle("expanded");

    button.textContent =
        sidebar.classList.contains("collapsed")
            ? "◀"
            : "▶";

}


function scrollToCategory(
    category,
    element
) {

    const section =
        document.getElementById(
            `section-${category}`
        );

    if (section) {

        section.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }

    document
        .querySelectorAll(".category-icon")
        .forEach(icon =>
            icon.classList.remove("active")
        );

    element.classList.add("active");

}


/* =========================================================
   3D EFFECT
========================================================= */

function setup3DEffect() {

    const cards =
        document.querySelectorAll(
            ".food-card"
        );

    cards.forEach(card => {

        if (
            card.dataset.threeD === "true"
        ) return;

        card.dataset.threeD = "true";

        card.addEventListener(
            "mousemove",
            e => {

                const rect =
                    card.getBoundingClientRect();

                const x =
                    e.clientX - rect.left;

                const y =
                    e.clientY - rect.top;

                const centerX =
                    rect.width / 2;

                const centerY =
                    rect.height / 2;

                const rotateY =
                    ((x - centerX) /
                    centerX) * 8;

                const rotateX =
                    ((centerY - y) /
                    centerY) * 8;

                card.style.transform =
                    `perspective(1200px)
                     rotateX(${rotateX}deg)
                     rotateY(${rotateY}deg)
                     translateY(-6px)`;

            }
        );

        card.addEventListener(
            "mouseleave",
            () => {

                card.style.transform =
                    "perspective(1200px) rotateX(0) rotateY(0) translateY(0)";

            }
        );

    });

}


/* =========================================================
   ADMIN
========================================================= */

function openAdminPanel() {

    const password =
        prompt(
            currentLang === "ar"
                ? "أدخل كلمة مرور المدير:"
                : "Enter admin password:"
        );

    if (password === "admin") {

        alert(
            "Admin panel ready."
        );

    } else if (
        password !== null
    ) {

        alert(
            currentLang === "ar"
                ? "كلمة المرور غير صحيحة!"
                : "Wrong password!"
        );

    }

}

<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>منيو حسب مزاجك</title>
<style>
body {
  font-family: Arial;
  text-align: center;
  background: #111;
  color: white;
}
button {
  margin: 10px;
  padding: 15px;
  font-size: 18px;
  cursor: pointer;
}
#menu {
  margin-top: 30px;
}
</style>
</head>
<body>

<h1>شلون مزاجك اليوم؟</h1>

<button onclick="showMenu('happy')">😍 سعيد</button>
<button onclick="showMenu('tired')">😴 تعبان</button>
<button onclick="showMenu('angry')">😤 متوتر</button>
<button onclick="showMenu('hungry')">🤤 جوعان جدًا</button>

<div id="menu"></div>

<script>
function showMenu(mood) {
  let menu = document.getElementById("menu");

  if (mood === "happy") {
    menu.innerHTML = "🍕 بيتزا - 🍔 برغر - 🥤 مشروب";
  } else if (mood === "tired") {
    menu.innerHTML = "🍲 شوربة - 🥗 سلطة - ☕ شاي";
  } else if (mood === "angry") {
    menu.innerHTML = "🍟 بطاطا - 🍗 دجاج مقلي - 🍕 بيتزا";
  } else if (mood === "hungry") {
    menu.innerHTML = "🍖 ستيك - 🍔 دبل برغر - 🍕 عائلي";
  }
}
</script>

</body>
</html>
